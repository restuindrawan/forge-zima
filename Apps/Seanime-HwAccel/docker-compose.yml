name: seanime-hwaccel
services:
  # One-shot root helper: makes the writable folders (config and
  # downloads) owned by the UID/GID Seanime runs as, and ensures the
  # anime folder top level is traversable by it. It never recursively
  # chowns your anime files.
  seanime-hwaccel-permissions:
    image: alpine:latest
    container_name: seanime-hwaccel-permissions
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        UID_VAL="$${PUID:-1000}"
        GID_VAL="$${PGID:-1000}"
        mkdir -p /config /downloads
        chown -R "$$UID_VAL:$$GID_VAL" /config /downloads
        chown "$$UID_VAL:$$GID_VAL" /anime
        chmod u+rwX /config /downloads /anime
        echo "permissions: config/downloads owned by $$UID_VAL:$$GID_VAL"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Media/Anime
        target: /anime
      - type: bind
        source: /DATA/Media/Downloads
        target: /downloads
    restart: "no"
  seanime-hwaccel:
    image: umagistr/seanime:v3.10.4-hwaccel
    container_name: seanime-hwaccel
    # Run as the owner of your media if its UID/GID is not 1000:1000.
    # Check with `ls -ln /DATA/Media/Anime` and set PUID/PGID at install.
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      seanime-hwaccel-permissions:
        condition: service_completed_successfully
    devices:
      - /dev/dri:/dev/dri
    # Numeric GIDs of the host groups that own /dev/dri (check with
    # `ls -ln /dev/dri`). Group names are not used because they are
    # resolved inside the image and may not match the host's GIDs.
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-105}"
    environment:
      SEANIME_SERVER_HOST: "0.0.0.0"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      VIDEO_GID: "${VIDEO_GID:-44}"
      RENDER_GID: "${RENDER_GID:-105}"
    # No default password is shipped: this repo is public. Set
    # SEANIME_SERVER_PASSWORD when installing (see tips), or set
    # server.password in config.toml after the first start.
    command: ["/app/seanime", "--password", "${SEANIME_SERVER_PASSWORD:-}"]
    restart: unless-stopped
    ports:
      - target: 43211
        published: "3213"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /home/seanime/.config/Seanime
      - type: bind
        source: /DATA/Media/Anime
        target: /anime
      - type: bind
        source: /DATA/Media/Downloads
        target: /downloads
    x-casaos:
      envs:
        - container: SEANIME_SERVER_HOST
          description:
            en_US: Bind address inside the container. Must be 0.0.0.0 so the published host port can reach Seanime, which defaults to 127.0.0.1.
        - container: SEANIME_SERVER_PASSWORD
          description:
            en_US: Server password for remote access. Required if Seanime is reachable outside this machine. Leave empty only on a trusted LAN. Never commit a real password to this public repo.
        - container: PUID
          description:
            en_US: User ID Seanime runs as. Check with `ls -ln /DATA/Media/Anime` and set this to the folder owner's UID if scanning shows an empty library. Defaults to 1000.
        - container: PGID
          description:
            en_US: Group ID Seanime runs as. Check with `ls -ln /DATA/Media/Anime` and set this to the folder owner's GID if scanning shows an empty library. Defaults to 1000.
        - container: VIDEO_GID
          description:
            en_US: Numeric GID of the host group that owns /dev/dri/card0. Check with `ls -ln /dev/dri`. Defaults to 44.
        - container: RENDER_GID
          description:
            en_US: Numeric GID of the host group that owns /dev/dri/renderD128. Check with `ls -ln /dev/dri`. Hardware transcoding needs this to match. Defaults to 105.
      ports:
        - container: "43211"
          description:
            en_US: Seanime WebUI port
      volumes:
        - container: /home/seanime/.config/Seanime
          description:
            en_US: Seanime config directory
        - container: /anime
          description:
            en_US: Anime library directory
        - container: /downloads
          description:
            en_US: Downloads directory

x-casaos:
  id: app.seanime-hwaccel
  main: seanime-hwaccel
  index: /
  port_map: "3213"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/restuindrawan/forge-zima@main/Apps/Seanime-HwAccel/icon.png
  title:
    en_US: Seanime (Intel HwAccel)
  tagline:
    en_US: Self-hosted anime and manga media server with Intel hardware transcoding
  description:
    en_US: |
      Seanime is an open-source media server with a web interface and desktop
      app for anime and manga. It integrates with AniList, manages your local
      library, streams and downloads episodes, and plays them with your media
      player of choice.

      This package uses the hwaccel image (umagistr/seanime:*-hwaccel). It
      runs as a non-root user and ships Jellyfin-FFmpeg with Intel QSV and
      VAAPI drivers, and passes /dev/dri through for hardware transcoding.
      It needs an Intel GPU on an amd64 host and uses host port 3213 so it
      can run next to the other Seanime variants.
  author: restuindrawan
  developer: 5rahim
  category: Media
  architectures:
    - amd64
  version: "3.10.4"
  update_at: "2026-10-31"
  release_notes:
    en_US: Add the Intel hardware acceleration Seanime variant, pinned to v3.10.4, on host port 3213 with /dev/dri passthrough, PUID/PGID, VIDEO_GID/RENDER_GID and optional SEANIME_SERVER_PASSWORD.
  website: https://seanime.app
  repo: https://github.com/5rahim/seanime
  support: https://github.com/5rahim/seanime/issues
  docs: https://docs.seanime.app
  tips:
    before_install:
      en_US: |
        Intel QSV/VAAPI: this variant needs an Intel GPU and /dev/dri on
        the Zima box. The image's maintainer notes hardware features could
        not be tested in CI, so check them on your own hardware. Without
        a working GPU, transcoding falls back to software or fails.

        Set VIDEO_GID and RENDER_GID to the numeric group IDs that own the
        GPU devices. On the Zima box run `ls -ln /dev/dri` and use the
        group column for card0 (VIDEO_GID) and renderD128 (RENDER_GID).
        Wrong values mean no GPU access inside the container.

        Rootless image: Seanime runs as UID:GID 1000:1000 by default. An
        init step fixes ownership of the config and downloads folders on
        every start, and never touches your anime files. If the scan
        shows an empty library, your media is probably owned by another
        user. Run `ls -ln /DATA/Media/Anime`, then set PUID and PGID to
        the owner's UID and GID at install.

        This app has its own config folder and WebUI port (3213), so it
        does not share settings with the other Seanime variants. Do not run
        two variants against the same downloads folder at the same time.

        Publishing outside your LAN: set a server password first. Seanime's
        docs require server.password when the server is reachable from
        outside this machine. Set SEANIME_SERVER_PASSWORD during install,
        or edit config.toml in the config folder after the first start and
        set password under [server], then restart. A password is not
        encryption: prefer a VPN such as Tailscale or an HTTPS reverse
        proxy over forwarding plain HTTP port 3213 on your router.
