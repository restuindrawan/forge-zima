name: seanime
services:
  seanime:
    image: umagistr/seanime:v3.10.4
    container_name: seanime
    environment:
      SEANIME_SERVER_HOST: "0.0.0.0"
    # No default password is shipped: this repo is public. Set
    # SEANIME_SERVER_PASSWORD when installing (see tips), or set
    # server.password in config.toml after the first start.
    command: ["/app/seanime", "--password", "${SEANIME_SERVER_PASSWORD:-}"]
    restart: unless-stopped
    ports:
      - target: 43211
        published: "3212"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /root/.config/Seanime
      - type: bind
        source: /DATA/Media/Anime
        target: /anime
      - type: bind
        source: /DATA/Media/Downloads
        target: /downloads
    x-casaos:
      envs:
        - container: SEANIME_SERVER_HOST
          description:
            en_US: Bind address inside the container. Must be 0.0.0.0 so the published host port can reach Seanime, which defaults to 127.0.0.1.
        - container: SEANIME_SERVER_PASSWORD
          description:
            en_US: Server password for remote access. Required if Seanime is reachable outside this machine. Leave empty only on a trusted LAN. Never commit a real password to this public repo.
      ports:
        - container: "43211"
          description:
            en_US: Seanime WebUI port
      volumes:
        - container: /root/.config/Seanime
          description:
            en_US: Seanime config directory
        - container: /anime
          description:
            en_US: Anime library directory
        - container: /downloads
          description:
            en_US: Downloads directory

x-casaos:
  id: app.seanime
  main: seanime
  index: /
  port_map: "3212"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/restuindrawan/forge-zima@main/Apps/Seanime/icon.png
  title:
    en_US: Seanime
  tagline:
    en_US: The media server for anime and manga
  description:
    en_US: |
      Seanime is a self-hosted media server packed with features to seamlessly stream, track, and manage your anime and manga.

      Seanime does not provide, host, or distribute any media content. You are responsible for obtaining media content through legal means. The software is a tool for organizing and consuming content you already own or have legal access to. By using Seanime, you agree to comply with your local laws and regulations.
  author: restuindrawan
  developer: 5rahim
  category: Media
  architectures:
    - amd64
    - arm64
  version: "3.10.4"
  update_at: "2026-10-31"
  release_notes:
    en_US: This app is now the default (root) Seanime image, pinned to v3.10.4, on host port 3212 with optional SEANIME_SERVER_PASSWORD. The rootless variant moved to its own app, Seanime Rootless.
  website: https://seanime.app
  repo: https://github.com/5rahim/seanime
  support: https://github.com/5rahim/seanime/issues
  docs: https://docs.seanime.app
  tips:
    before_install:
      en_US: |
        Default image: Seanime runs as root inside the container, so any
        media ownership works. Files
        Seanime creates in the downloads folder will be owned by root. If
        you want a non-root process instead, install Seanime Rootless.

        This app has its own config folder and WebUI port (3212), so it
        does not share settings with the other Seanime variants. Do not run
        two variants against the same downloads folder at the same time.

        Publishing outside your LAN: set a server password first. Seanime's
        docs require server.password when the server is reachable from
        outside this machine. Set SEANIME_SERVER_PASSWORD during install,
        or edit config.toml in the config folder after the first start and
        set password under [server], then restart. A password is not
        encryption: prefer a VPN such as Tailscale or an HTTPS reverse
        proxy over forwarding plain HTTP port 3212 on your router.
