name: seanime
services:
  seanime:
    image: umagistr/seanime:v3.10.4
    container_name: seanime
    environment:
      SEANIME_SERVER_HOST: "0.0.0.0"
    # No default password is shipped: this repo is public. Set
    # SEANIME_SERVER_PASSWORD when installing (see tips), or set
    # server.password in config.toml after the first start.
    command: ["/app/seanime", "--password", "${SEANIME_SERVER_PASSWORD:-}"]
    restart: unless-stopped
    ports:
      - target: 43211
        published: "3212"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /root/.config/Seanime
      - type: bind
        source: /DATA/Media/Anime
        target: /anime
      - type: bind
        source: /DATA/Media/Downloads
        target: /downloads
x-casaos:
  id: app.seanime
  main: seanime
  index: /
  port_map: "3212"
  scheme: http
  icon: https://restuindrawan.github.io/forge-zima/apps/app.seanime/assets/icon.png
  title:
    en_US: Seanime
  version: "3.10.4"
