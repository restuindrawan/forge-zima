name: seanime
services:
  seanime:
    image: umagistr/seanime:latest-rootless@sha256:b7275b11ee088e00ebe35d87c3caf4c740363b20307aa832c08fdd78758fb7e7
    container_name: seanime
    environment:
      SEANIME_SERVER_HOST: "0.0.0.0"
    restart: unless-stopped
    ports:
      - target: 43211
        published: "3211"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /home/seanime/.config/Seanime
      - type: bind
        source: /DATA/Media/Anime
        target: /anime
      - type: bind
        source: /DATA/Media/Downloads
        target: /downloads
x-casaos:
  id: app.seanime
  main: seanime
  index: /
  port_map: "3211"
  scheme: http
  icon: https://restuindrawan.github.io/forge-zima/apps/app.seanime/assets/icon.png
  title:
    en_US: Seanime
  version: "3.10.4"
