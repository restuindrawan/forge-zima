name: seanime
services:
  # One-shot root helper: makes the writable folders (config and
  # downloads) owned by the UID/GID Seanime runs as, and ensures the
  # anime folder top level is traversable by it. It never recursively
  # chowns your anime files.
  seanime-permissions:
    image: alpine:latest@sha256:e311ae748be7f56ae5cba304bc488f0786df68ee507513f654a5cc8597cffb42
    container_name: seanime-permissions
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        UID_VAL="$${PUID:-1000}"
        GID_VAL="$${PGID:-1000}"
        mkdir -p /config /downloads
        chown -R "$$UID_VAL:$$GID_VAL" /config /downloads
        chown "$$UID_VAL:$$GID_VAL" /anime
        chmod u+rwX /config /downloads /anime
        echo "permissions: config/downloads owned by $$UID_VAL:$$GID_VAL"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Media/Anime
        target: /anime
      - type: bind
        source: /DATA/Media/Downloads
        target: /downloads
    restart: "no"
  seanime:
    image: umagistr/seanime:latest-rootless@sha256:406a1ece81438e56def5bb41f02f66cc49778e399192e4f83a3ce5a6bc1bf6ed
    container_name: seanime
    # Run as the owner of your media if its UID/GID is not 1000:1000.
    # Check with `ls -ln /DATA/Media/Anime` and set PUID/PGID at install.
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      seanime-permissions:
        condition: service_completed_successfully
    environment:
      SEANIME_SERVER_HOST: "0.0.0.0"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    # No default password is shipped: this repo is public. Set
    # SEANIME_SERVER_PASSWORD when installing (see tips), or set
    # server.password in config.toml after the first start.
    command: ["/app/seanime", "--password", "${SEANIME_SERVER_PASSWORD:-}"]
    restart: unless-stopped
    ports:
      - target: 43211
        published: "3211"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /home/seanime/.config/Seanime
      - type: bind
        source: /DATA/Media/Anime
        target: /anime
      - type: bind
        source: /DATA/Media/Downloads
        target: /downloads
x-casaos:
  id: app.seanime
  main: seanime
  index: /
  port_map: "3211"
  scheme: http
  icon: https://restuindrawan.github.io/forge-zima/apps/app.seanime/assets/icon.png
  title:
    en_US: Seanime
  version: "3.10.4"
