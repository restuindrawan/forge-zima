name: seanime-hwaccel
services:
  # One-shot root helper: makes the writable folders (config and
  # downloads) owned by the UID/GID Seanime runs as, and ensures the
  # anime folder top level is traversable by it. It never recursively
  # chowns your anime files.
  seanime-hwaccel-permissions:
    image: alpine:latest
    container_name: seanime-hwaccel-permissions
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        UID_VAL="$${PUID:-1000}"
        GID_VAL="$${PGID:-1000}"
        mkdir -p /config /downloads
        chown -R "$$UID_VAL:$$GID_VAL" /config /downloads
        chown "$$UID_VAL:$$GID_VAL" /anime
        chmod u+rwX /config /downloads /anime
        echo "permissions: config/downloads owned by $$UID_VAL:$$GID_VAL"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Media/Anime
        target: /anime
      - type: bind
        source: /DATA/Media/Downloads
        target: /downloads
    restart: "no"
  seanime-hwaccel:
    image: umagistr/seanime:v3.10.4-hwaccel
    container_name: seanime-hwaccel
    # Run as the owner of your media if its UID/GID is not 1000:1000.
    # Check with `ls -ln /DATA/Media/Anime` and set PUID/PGID at install.
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      seanime-hwaccel-permissions:
        condition: service_completed_successfully
    devices:
      - /dev/dri:/dev/dri
    # Numeric GIDs of the host groups that own /dev/dri (check with
    # `ls -ln /dev/dri`). Group names are not used because they are
    # resolved inside the image and may not match the host's GIDs.
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-105}"
    environment:
      SEANIME_SERVER_HOST: "0.0.0.0"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      VIDEO_GID: "${VIDEO_GID:-44}"
      RENDER_GID: "${RENDER_GID:-105}"
    # No default password is shipped: this repo is public. Set
    # SEANIME_SERVER_PASSWORD when installing (see tips), or set
    # server.password in config.toml after the first start.
    command: ["/app/seanime", "--password", "${SEANIME_SERVER_PASSWORD:-}"]
    restart: unless-stopped
    ports:
      - target: 43211
        published: "3213"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /home/seanime/.config/Seanime
      - type: bind
        source: /DATA/Media/Anime
        target: /anime
      - type: bind
        source: /DATA/Media/Downloads
        target: /downloads
x-casaos:
  id: app.seanime-hwaccel
  main: seanime-hwaccel
  index: /
  port_map: "3213"
  scheme: http
  icon: https://restuindrawan.github.io/forge-zima/apps/app.seanime-hwaccel/assets/icon.png
  title:
    en_US: Seanime (Intel HwAccel)
  version: "3.10.4"
